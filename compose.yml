services:
  zephyr:
    image: sirena-lwm2m-zephyr-dev:v0.30.0
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - zephyr-workspace:/opt/zephyr-workspace
      - ccache:/root/.ccache
    tty: true
    stdin_open: true
    command: bash

  flash:
    image: sirena-lwm2m-zephyr-dev:v0.30.0
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - flash
    privileged: true
    devices:
      - /dev/bus/usb
    working_dir: /workspace
    volumes:
      - .:/workspace
      - zephyr-workspace:/opt/zephyr-workspace
      - ccache:/root/.ccache
    tty: true
    stdin_open: true
    command: bash

  leshan:
    image: sirena-lwm2m-zephyr-leshan:v2.0.0-M17
    build:
      context: .
      dockerfile: src/tests/leshan/leshan.Dockerfile
      args:
        LESHAN_VERSION: 2.0.0-M17
    profiles:
      - leshan
    command:
      - "-lp"
      - "5683"
      - "-wp"
      - "8080"

  leshan-client:
    image: sirena-lwm2m-zephyr-dev:v0.30.0
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - leshan
    depends_on:
      - leshan
    network_mode: "service:leshan"
    user: root
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - zephyr-workspace:/opt/zephyr-workspace
      - leshan-build:/opt/leshan-build
      - ccache:/opt/ccache
    command: python3 /workspace/src/tests/leshan/harness.py

volumes:
  ccache:
  zephyr-workspace:
  leshan-build:
