CONFIG_SIRENA_LWM2M=y
CONFIG_SIRENA_LWM2M_TRANSPORT_COAP=n
CONFIG_SIRENA_LWM2M_TRANSPORT_DTLS=n
CONFIG_SIRENA_LWM2M_TRANSPORT_MQTT=y
CONFIG_SIRENA_LWM2M_TRANSPORT_NOSEC=y
CONFIG_ZTEST=y

CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y
CONFIG_ETH_NATIVE_TAP=n

CONFIG_ZVFS_OPEN_MAX=32
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32

CONFIG_MQTT_LIB=y
CONFIG_MQTT_VERSION_3_1_1=y
CONFIG_MQTT_KEEPALIVE=30
CONFIG_SIRENA_LWM2M_MQTT_RESPONSE_TIMEOUT_MS=3000

CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_SRV_C=y
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_MBEDTLS_PSK_MAX_LEN=64

CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=4
CONFIG_NET_SOCKETS_TLS_MAX_SESSION_CONTEXTS=16

CONFIG_PSA_WANT_ALG_CCM=y

